<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23ffb060%22/%3E%3C/svg%3E">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a2140">
<title>Dusk Isles: a roguelite</title>
<meta name="description" content="A cozy dusk action roguelite in your browser: every hit is readable before it lands, and every combo is visible before you pick it.">
<meta property="og:title" content="Dusk Isles">
<meta property="og:description" content="Fight through floating dusk islands, build combos, die, learn, go again. Plays in your browser.">
<script>
  // iOS Safari: block pinch-zoom gestures and the second tap of a double-tap (zoom), keep single taps.
  (function () {
    var last = 0;
    var formField = function (t) { return t && t.closest && t.closest("input, select, textarea"); };
    document.addEventListener("touchend", function (e) {
      var now = Date.now();
      if (now - last < 350 && !formField(e.target)) e.preventDefault();
      last = now;
    }, { passive: false });
    ["gesturestart", "gesturechange", "gestureend"].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false }); });
    document.addEventListener("dblclick", function (e) { e.preventDefault(); }, { passive: false });
  })();
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2140; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  /* touch-action is not inherited: every element must opt out of double-tap zoom (iOS ignores user-scalable=no) */
  *, *::before, *::after { touch-action: manipulation; }
  canvas, #app, .dusk-touch, .dusk-touch * { touch-action: none; }
  input[type=range] { touch-action: pan-x; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #e9e0f5; font: 600 18px system-ui, sans-serif; background: #2a2140; z-index: 50; }
  #boot.hide { display: none; }
  noscript { color: #e9e0f5; font: 16px system-ui; }
</style>
</head>
<body>
<div id="app"></div>
<div id="ui"></div>
<div id="boot" role="status">Loading the first island…</div>
<noscript>This game needs JavaScript and WebGL.</noscript>
<script type="module">
  const boot = document.getElementById("boot");
  const gl = document.createElement("canvas").getContext("webgl2");
  if (!gl) { boot.textContent = "This game needs WebGL 2. Try a current Chrome, Safari, Firefox or Edge."; }
  else {
    import("./game.js").then(() => boot.classList.add("hide")).catch(e => { console.error(e); boot.textContent = "Something went wrong loading the game. Reload to try again."; });
  }
</script>
</body>
</html>
